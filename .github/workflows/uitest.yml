name: UI Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          device: Pixel 6
          disable-animations: true
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          script: ./gradlew clean :app:connectedDebugAndroidTest :action_components:connectedDebugAndroidTest :text_input_components:connectedDebugAndroidTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/androidTests/connected/**'

      - name: Upload Test Results & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/outputs/connected_android_test_additional_output/**
            **/build/outputs/logs/**
          if-no-files-found: warn

      - name: Capture Logcat on Failure
        if: failure()
        run: adb logcat -d > logcat.txt

      - name: Upload Logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
